<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- Body Radial Gradient -->
    <radialGradient id="nomsterBodyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="35%" stop-color="#22C55E" />
      <stop offset="75%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#14532D" />
    </radialGradient>

    <!-- Antenna Gradient -->
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Eye Shine Radial -->
    <radialGradient id="eyeShine" cx="35%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </radialGradient>

    <!-- Pupil Gradient -->
    <radialGradient id="pupilGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="85%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Mouth Cavity Gradient -->
    <radialGradient id="mouthCavity" cx="50%" cy="75%" r="70%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Tongue Gradient -->
    <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#15803D" flood-opacity="0.35" />
    </filter>

    <filter id="cheekBlur">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="222" rx="68" ry="12" fill="#000000" opacity="0.35" />

  <!-- Tiny Feet -->
  <!-- Left Foot -->
  <ellipse cx="88" cy="214" rx="20" ry="13" fill="#15803D" />
  <ellipse cx="86" cy="212" rx="16" ry="9" fill="#16A34A" />
  <!-- Left Foot Toes -->
  <circle cx="75" cy="216" r="4.5" fill="#22C55E" />
  <circle cx="86" cy="218" r="4.5" fill="#22C55E" />
  <circle cx="97" cy="216" r="4.5" fill="#22C55E" />

  <!-- Right Foot -->
  <ellipse cx="152" cy="214" rx="20" ry="13" fill="#15803D" />
  <ellipse cx="154" cy="212" rx="16" ry="9" fill="#16A34A" />
  <!-- Right Foot Toes -->
  <circle cx="143" cy="216" r="4.5" fill="#22C55E" />
  <circle cx="154" cy="218" r="4.5" fill="#22C55E" />
  <circle cx="165" cy="216" r="4.5" fill="#22C55E" />

  <!-- Little Antenna / Horn on Head -->
  <path d="M 120 48 Q 115 25 106 18 Q 120 22 124 47 Z" fill="url(#antennaGrad)" />
  <circle cx="106" cy="18" r="7" fill="#4ADE80" filter="drop-shadow(0 0 4px #22C55E)" />

  <!-- Main Chubby Body -->
  <path d="M 120 45 
           C 175 45, 205 85, 205 140 
           C 205 192, 172 216, 120 216 
           C 68 216, 35 192, 35 140 
           C 35 85, 65 45, 120 45 Z" 
        fill="url(#nomsterBodyGrad)" 
        filter="url(#softGlow)" />

  <!-- Body Highlight Shimmer -->
  <path d="M 85 58 C 110 50, 130 52, 145 56 C 115 62, 95 72, 85 85 C 75 73, 76 63, 85 58 Z" 
        fill="#FFFFFF" opacity="0.4" />

  <!-- Rosy Cheeks -->
  <ellipse cx="64" cy="145" rx="14" ry="9" fill="#F43F5E" opacity="0.45" filter="url(#cheekBlur)" />
  <ellipse cx="176" cy="145" rx="14" ry="9" fill="#F43F5E" opacity="0.45" filter="url(#cheekBlur)" />

  <!-- Wide Cheerful Open Mouth (Ready for Candy) -->
  <!-- Outer Mouth Border -->
  <path d="M 72 135 
           Q 120 120 168 135 
           Q 176 184 120 186 
           Q 64 184 72 135 Z" 
        fill="#064E3B" />
  
  <!-- Mouth Cavity Interior -->
  <path d="M 74 137 
           Q 120 124 166 137 
           Q 172 182 120 184 
           Q 68 182 74 137 Z" 
        fill="url(#mouthCavity)" />

  <!-- Tongue Inside Mouth -->
  <path d="M 94 172 
           Q 120 148 146 172 
           Q 138 183 120 184 
           Q 102 183 94 172 Z" 
        fill="url(#tongueGrad)" />
  <path d="M 120 162 L 120 178" stroke="#BE185D" stroke-width="2" stroke-linecap="round" opacity="0.5" />

  <!-- Cute Little Fangs / Top Teeth -->
  <polygon points="98,136 103,145 108,136" fill="#FFFFFF" rx="1" />
  <polygon points="132,136 137,145 142,136" fill="#FFFFFF" rx="1" />

  <!-- Expressive Big Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="88" cy="100" rx="26" ry="30" fill="url(#eyeShine)" stroke="#15803D" stroke-width="3.5" />
  <!-- Left Pupil -->
  <ellipse cx="94" cy="102" rx="16" ry="18" fill="url(#pupilGrad)" />
  <!-- Left Eye Sparkles -->
  <circle cx="89" cy="94" r="6" fill="#FFFFFF" />
  <circle cx="102" cy="110" r="2.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="152" cy="100" rx="26" ry="30" fill="url(#eyeShine)" stroke="#15803D" stroke-width="3.5" />
  <!-- Right Pupil -->
  <ellipse cx="146" cy="102" rx="16" ry="18" fill="url(#pupilGrad)" />
  <!-- Right Eye Sparkles -->
  <circle cx="141" cy="94" r="6" fill="#FFFFFF" />
  <circle cx="154" cy="110" r="2.5" fill="#FFFFFF" />

  <!-- Cute Friendly Eyebrows -->
  <path d="M 68 70 Q 88 64 104 74" stroke="#166534" stroke-width="4.5" stroke-linecap="round" fill="none" />
  <path d="M 172 70 Q 152 64 136 74" stroke="#166534" stroke-width="4.5" stroke-linecap="round" fill="none" />

  <!-- Cute Little Stubby Hands/Paws Resting on Tummy -->
  <ellipse cx="52" cy="172" rx="12" ry="9" fill="#16A34A" stroke="#14532D" stroke-width="2" transform="rotate(-15 52 172)" />
  <ellipse cx="188" cy="172" rx="12" ry="9" fill="#16A34A" stroke="#14532D" stroke-width="2" transform="rotate(15 188 172)" />
</svg>
